spring:
  application:
    name: Practica
  profiles:
      active: dev  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 500ms
      timeout: 500ms
  cache:
    type: redis
    cache-names: categorias, productos
    redis:
      time-to-live: 10m
      enable-statistics: true
      cache-null-values: false
