server:
  port: ${SERVER_PORT:8081}
spring:
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1522/FREEPDB1}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

    properties:
      hibernate:
        format_sql: false
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
logging:
  level:
    pe.edu.upeu.Practica: INFO
app:
  jwt:
    secret: ${JWT_SECRET}
    expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:30}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
